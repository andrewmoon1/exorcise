# Runs the tests on every push and pull request.
# Publishes the app/ folder to GitHub Pages only on pushes to main, because
# the github-pages environment only allows deploys from main.
name: Deploy to GitHub Pages
 
on:
  push:
  pull_request:
  workflow_dispatch:
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
 
  # Upload and deploy run as separate jobs. When both steps ran in one job,
  # GitHub sometimes had not yet listed the uploaded files when the deploy
  # step looked for them, and a re-run then found two uploads and failed.
  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
 